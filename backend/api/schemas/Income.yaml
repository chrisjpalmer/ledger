required:
  - name
  - date
type: object
properties:
  id:
    type: string
    example: "d7982b1e-397c-4b08-854f-7fab38e29c7b"
  name:
    type: string
    example: Salary
  amount:
   type: number
   format: float
   example: 10.33
   minimum: 0
  date:
    type: string
    format: date
    example: 2024-12-01
  received:
    type: boolean
    example: true
