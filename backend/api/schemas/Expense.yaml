required:
  - name
  - date
type: object
properties:
  id:
    type: string
    example: "d7982b1e-397c-4b08-854f-7fab38e29c7b"
  name:
    type: string
    example: Christmas Lunch
  amount:
   type: number
   format: float
   example: 2.34
   minimum: 0
  date:
    type: string
    format: date
    example: 2024-12-01
  paid:
    type: boolean
    example: true
